[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fquant"
version = "1.0.0"
description = "Post-Training LLM Quantization Toolkit"
readme = "README.md"
authors = [{ name = "F-Labs Team", email = "contact@flabs.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "huggingface_hub>=0.20.0"
]

[project.scripts]
fquant = "fquant.cli:main"
